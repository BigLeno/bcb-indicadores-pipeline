# Ambiente local: Airflow 3 (LocalExecutor) + dois Postgres separados.
#   airflow-db -> metadata do Airflow
#   warehouse  -> dados do pipeline (raw, staging, marts)
# Adaptado do docker-compose.yaml oficial do Airflow 3.3.2.

x-airflow-common: &airflow-common
  build:
    context: .
    target: runtime
  image: bcb-indicadores-pipeline:local
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?defina no .env}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:?defina no .env}@airflow-db/airflow
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET_KEY:?defina no .env}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?defina no .env}
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: "30"
    WAREHOUSE_HOST: warehouse
    WAREHOUSE_PORT: "5432"
    WAREHOUSE_DB: ${WAREHOUSE_DB:?defina no .env}
    WAREHOUSE_USER: ${WAREHOUSE_USER:?defina no .env}
    WAREHOUSE_PASSWORD: ${WAREHOUSE_PASSWORD:?defina no .env}
    SGS_TIMEOUT_SECONDS: ${SGS_TIMEOUT_SECONDS:-60}
    SGS_MAX_ATTEMPTS: ${SGS_MAX_ATTEMPTS:-4}
    SGS_BACKOFF_SECONDS: ${SGS_BACKOFF_SECONDS:-2}
    SGS_WINDOW_YEARS: ${SGS_WINDOW_YEARS:-5}
    MIGRATIONS_DIR: /opt/airflow/project/sql/migrations
    SERIES_CONFIG_PATH: /opt/airflow/project/config/series.yaml
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./src:/opt/airflow/project/src
    - ./sql:/opt/airflow/project/sql:ro
    - ./config:/opt/airflow/project/config:ro
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on: &airflow-common-depends-on
    airflow-db:
      condition: service_healthy
    warehouse:
      condition: service_healthy

x-airflow-service-depends-on: &airflow-service-depends-on
  <<: *airflow-common-depends-on
  airflow-init:
    condition: service_completed_successfully
  warehouse-migrate:
    condition: service_completed_successfully

services:
  airflow-db:
    image: postgres:17
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      POSTGRES_DB: airflow
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow", "-d", "airflow"]
      interval: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  warehouse:
    image: postgres:17
    environment:
      POSTGRES_USER: ${WAREHOUSE_USER}
      POSTGRES_PASSWORD: ${WAREHOUSE_PASSWORD}
      POSTGRES_DB: ${WAREHOUSE_DB}
    ports:
      - "127.0.0.1:${WAREHOUSE_HOST_PORT:-5433}:5432"
    volumes:
      - warehouse-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  # Migra o metadata DB e cria o usuário admin da UI (tratado pelo entrypoint da imagem).
  airflow-init:
    <<: *airflow-common
    command: version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USERNAME:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?defina no .env}
    depends_on:
      airflow-db:
        condition: service_healthy

  # Aplica sql/migrations no warehouse antes de o Airflow começar a rodar tasks.
  warehouse-migrate:
    <<: *airflow-common
    command: python -m bcb_pipeline.migrate
    depends_on:
      warehouse:
        condition: service_healthy

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "127.0.0.1:${AIRFLOW_HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    depends_on: *airflow-service-depends-on

  # Com LocalExecutor as tasks rodam como subprocessos do scheduler.
  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    depends_on: *airflow-service-depends-on

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on: *airflow-service-depends-on

  # Pytest e ruff numa imagem com as mesmas versões do runtime (make test / make lint).
  tools:
    <<: *airflow-common
    build:
      context: .
      target: dev
    image: bcb-indicadores-pipeline:dev
    profiles: [tools]
    working_dir: /opt/airflow/project
    # Sem o entrypoint oficial (que tentaria rodar `airflow pytest`). Os pacotes da imagem
    # ficam no user site de /home/airflow, então o HOME precisa apontar para lá.
    entrypoint: []
    environment:
      <<: *airflow-common-env
      HOME: /home/airflow
    command: pytest
    volumes:
      - ./dags:/opt/airflow/project/dags
      - ./src:/opt/airflow/project/src
      - ./sql:/opt/airflow/project/sql:ro
      - ./config:/opt/airflow/project/config:ro
      - ./tests:/opt/airflow/project/tests
      - ./pyproject.toml:/opt/airflow/project/pyproject.toml:ro
    depends_on: {}

volumes:
  airflow-db-data:
  warehouse-data:
